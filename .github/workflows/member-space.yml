name: Astra member space
on:
  pull_request:
    paths:
      - 'resources/**'
      - 'app/View/**'
      - 'app/Http/Controllers/LandingController.php'
      - 'app/Http/Controllers/ZumraSpaceController.php'
      - 'app/Http/Controllers/ZumraFormationController.php'
      - 'app/Http/Controllers/ZumraDiscussionController.php'
      - 'app/Http/Controllers/ZumraMembersController.php'
      - 'app/Http/Controllers/ZumraActivityController.php'
      - 'app/Http/Controllers/ZumraEventSpaceController.php'
      - 'app/Http/Controllers/CommunityEventController.php'
      - 'app/Http/Controllers/ZumraProgramMembershipController.php'
      - 'app/Http/Controllers/ZumraMembershipPaymentController.php'
      - 'app/Http/Controllers/ProjectController.php'
      - 'app/Application/Activity/ZumraActivityProjection.php'
      - 'app/Application/Comments/ContextCommentService.php'
      - 'app/Application/Community/CommunityEventService.php'
      - 'routes/cap006.php'
      - 'routes/cap021.php'
      - 'routes/cap068.php'
      - 'app/Models/ZumraGroup.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'database/migrations/**'
      - 'public/images/zumra/**'
      - 'public/sitemap.xml'
      - 'tests/Feature/LandingPublicDiscoveryTest.php'
      - 'tests/Feature/MemberSpaceTest.php'
      - 'tests/Feature/ZumraWorldSmokeTest.php'
      - 'tests/Feature/ZumraFormationSmokeTest.php'
      - 'tests/Feature/ZumraDiscussionTest.php'
      - 'tests/Feature/ZumraMembersTest.php'
      - 'tests/Feature/ZumraActivityTest.php'
      - 'tests/Feature/ZumraEventSpaceTest.php'
      - 'tests/Feature/CommunityEventTest.php'
      - 'tests/Feature/CommunityEventHttpTest.php'
      - 'tests/Feature/CommunityEventOrganizerJourneyTest.php'
      - 'tests/Feature/AdhesionZahabTest.php'
      - 'tests/Feature/ZumraMembershipSurfaceTest.php'
      - 'tests/Feature/ProjectCvSmokeTest.php'
      - 'tests/Frontend/**'
      - '.github/workflows/member-space.yml'
permissions:
  contents: read
jobs:
  member-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, dom, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci --include=dev
      - run: npm run test:frontend
      - run: npm run build
      - run: php artisan view:cache
      - run: php artisan test tests/Feature/LandingPublicDiscoveryTest.php tests/Feature/MemberSpaceTest.php tests/Feature/ZumraWorldSmokeTest.php tests/Feature/ZumraFormationSmokeTest.php tests/Feature/ZumraDiscussionTest.php tests/Feature/ZumraMembersTest.php tests/Feature/ZumraActivityTest.php tests/Feature/ZumraEventSpaceTest.php tests/Feature/CommunityEventTest.php tests/Feature/AdhesionZahabTest.php tests/Feature/ZumraMembershipSurfaceTest.php tests/Feature/ProjectCvSmokeTest.php tests/Feature/FederationContinuationTest.php tests/Feature/IdentityAuthorityGuardTest.php
        env:
          ASTRA_VISUAL_EXPORT: '1'
      - name: Export synthetic rendered states for visual review
        run: |
          python3 - <<'PYQA'
          import base64, json, pathlib
          files = {p.name: p.read_text() for p in pathlib.Path('storage/app/astra-visual').glob('*.html')}
          print('ASTRA_VISUAL_B64=' + base64.b64encode(json.dumps(files).encode()).decode())
          PYQA
      - uses: actions/upload-artifact@v4
        with:
          name: astra-rendered-states
          path: storage/app/astra-visual
          retention-days: 7
