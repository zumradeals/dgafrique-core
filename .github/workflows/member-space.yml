name: Astra member space
on:
  pull_request:
    paths:
      - 'resources/**'
      - 'app/View/**'
      - 'app/Providers/AppServiceProvider.php'
      - 'tests/Feature/MemberSpaceTest.php'
      - 'tests/Frontend/**'
      - '.github/workflows/member-space.yml'
permissions:
  contents: read
jobs:
  member-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, dom, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci --include=dev
      - run: npm run test:frontend
      - run: npm run build
      - run: php artisan view:cache
      - run: php artisan test tests/Feature/MemberSpaceTest.php tests/Feature/FederationContinuationTest.php tests/Feature/IdentityAuthorityGuardTest.php
